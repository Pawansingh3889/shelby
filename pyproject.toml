[project]
name = "shelby"
version = "0.0.1"
description = "Personal voice assistant built on Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "anyio>=4.0",
  "httpx>=0.28",
  "faster-whisper>=1.2",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "pyttsx3>=2.99",
  "edge-tts>=7.2",
  "av>=17.0",
  "webrtcvad-wheels>=2.0",
  "openwakeword>=0.6",
  "psutil>=5.9",
]

[project.scripts]
shelby = "shelby.cli:run"
shelby-voice = "shelby.voice_cli:run"
shelby-ambient = "shelby.ambient_cli:run"
shelby-demo = "shelby.web_cli:run"
shelby-memory = "shelby.memory_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelby"]

[tool.hatch.build.targets.wheel.force-include]
"shelby/static" = "shelby/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
