[project]
name = "jarvis"
version = "0.0.1"
description = "Personal voice assistant built on Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "anyio>=4.0",
]

[project.scripts]
jarvis = "jarvis.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
